name: Publish museum AR
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify and unpack the museum application
        run: |
          sha256sum --check archive.sha256
          cat museum-ar.zip.part-* > "$RUNNER_TEMP/museum-ar.zip"
          unzip -q "$RUNNER_TEMP/museum-ar.zip" -d "$RUNNER_TEMP/museum-ar"
          test -s "$RUNNER_TEMP/museum-ar/site/index.html"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/museum-ar/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
